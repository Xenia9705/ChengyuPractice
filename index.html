<style>
/* Layout: one narrow column, phone first. Tabs pick the drill, a thin progress rule sits under them,
   and every number character inside an idiom is tinted so the counting pattern is visible. */
:root {
  --bg: #edf0f3;
  --surface: #ffffff;
  --ink: #16202a;
  --muted: #5b6875;
  --line: #d3dae1;
  --accent: #2b4a7e;
  --accent-ink: #ffffff;
  --sel: #e1e8f4;
  --ok: #1d7a57;
  --ok-bg: #dcf0e6;
  --bad: #b03a2e;
  --bad-bg: #f8e1dd;
  --serif: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --surface: #1a222b; --ink: #e6ecf2; --muted: #94a2b0; --line: #2c3743;
    --accent: #8fb0ea; --accent-ink: #0f1722; --sel: #223049;
    --ok: #5fd0a0; --ok-bg: #17382c; --bad: #f0877a; --bad-bg: #3f211d;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --surface: #1a222b; --ink: #e6ecf2; --muted: #94a2b0; --line: #2c3743;
  --accent: #8fb0ea; --accent-ink: #0f1722; --sel: #223049;
  --ok: #5fd0a0; --ok-bg: #17382c; --bad: #f0877a; --bad-bg: #3f211d;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6;
}
.wrap {
  max-width: 640px; margin: 0 auto; padding-block: 20px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
header h1 { font-family: var(--serif); font-size: 1.7rem; line-height: 1.2; margin: 0; text-wrap: balance; }
header p { margin: 4px 0 0; color: var(--muted); font-size: 0.9rem; }
.tabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); }
.tab {
  flex: 1; min-height: 46px; background: none; border: 0; border-bottom: 3px solid transparent;
  color: var(--muted); font: inherit; font-weight: 500; cursor: pointer; padding: 6px 4px;
}
.tab[aria-selected="true"] { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
.bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 14px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .25s; }
.tools { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 14px; color: var(--muted); font-size: 0.88rem; gap: 12px; }
.tools label { display: flex; align-items: center; gap: 6px; cursor: pointer; min-height: 32px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 14px; }
.kicker { margin: 0 0 6px; color: var(--muted); font-size: 0.88rem; letter-spacing: .08em; }
.idiom { font-family: var(--serif); font-size: 2.2rem; line-height: 1.25; margin: 4px 0 2px; text-wrap: balance; }
.py { color: var(--muted); font-size: 0.95rem; margin: 0; font-family: var(--sans); font-weight: 400; }
b.n { color: var(--accent); font-weight: inherit; }
.sent { font-size: 1.15rem; line-height: 1.9; margin: 0; }
.gap { display: inline-block; min-width: 4.2em; border-bottom: 2px solid var(--accent); margin: 0 2px; }
mark { background: var(--sel); color: var(--ink); padding: 1px 6px; border-radius: 4px; font-weight: 700; }
.opts { display: grid; gap: 10px; margin-bottom: 14px; }
.opts.two { grid-template-columns: 1fr 1fr; }
.opt {
  display: flex; gap: 12px; align-items: center; text-align: left; width: 100%; min-height: 54px;
  background: var(--surface); color: var(--ink); border: 1.5px solid var(--line); border-radius: 10px;
  padding: 10px 14px; font: inherit; cursor: pointer;
}
.opts.two .opt { justify-content: center; text-align: center; font-family: var(--serif); font-size: 1.15rem; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; font-size: .8rem; color: var(--muted); }
.opts.two .opt .k { display: none; }
.opt:hover { border-color: var(--accent); }
.opt.ok { background: var(--ok-bg); border-color: var(--ok); }
.opt.bad { background: var(--bad-bg); border-color: var(--bad); }
.opt.lock { pointer-events: none; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.fb .verdict { margin: 0 0 6px; font-weight: 700; }
.fb.good .verdict { color: var(--ok); }
.fb.miss .verdict { color: var(--bad); }
.fb .big { font-family: var(--serif); font-size: 1.4rem; margin: 0 0 2px; }
.fb p { margin: 6px 0; }
.why { color: var(--muted); font-size: 0.95rem; }
.ex { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px !important; }
.ex2 { color: var(--muted); }
.src { color: var(--muted); font-size: .82rem; }
.picked { font-size: .92rem; color: var(--muted); }
.primary {
  width: 100%; min-height: 50px; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px;
  font: inherit; font-weight: 700; cursor: pointer;
}
.primary:disabled { opacity: .4; cursor: not-allowed; }
.ghost {
  width: 100%; min-height: 50px; background: none; color: var(--accent); border: 1.5px solid var(--accent);
  border-radius: 10px; font: inherit; font-weight: 700; cursor: pointer;
}
.stack { display: grid; gap: 10px; }
.score { font-family: var(--serif); font-size: 3rem; line-height: 1; margin: 6px 0 2px; }
.misslist { list-style: none; margin: 10px 0 0; padding: 0; display: grid; gap: 12px; }
.misslist li { border-top: 1px solid var(--line); padding-top: 10px; }
.misslist strong { font-family: var(--serif); font-size: 1.15rem; }
.hint { color: var(--muted); font-size: .92rem; margin: 0 0 12px; }
.psent { padding: 14px 0; border-top: 1px solid var(--line); }
.psent:first-of-type { border-top: 0; padding-top: 4px; }
.slot {
  display: inline-block; min-width: 5.2em; min-height: 36px; vertical-align: baseline; margin: 0 2px;
  padding: 0 8px; background: none; color: var(--ink); font-family: var(--serif); font-size: 1.05rem; line-height: 1.7;
  border: 0; border-bottom: 2px solid var(--accent); cursor: pointer; border-radius: 4px 4px 0 0;
}
.slot.filled { background: var(--sel); font-weight: 700; }
.slot.active { background: var(--sel); outline: 2px solid var(--accent); }
.slot.ok { background: var(--ok-bg); border-bottom-color: var(--ok); }
.slot.bad { background: var(--bad-bg); border-bottom-color: var(--bad); }
.rf { margin: 8px 0 0; font-size: .95rem; }
.rf.ok { color: var(--ok); }
.rf.bad { color: var(--bad); }
.tray {
  position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
  padding: 10px 0 calc(8px + env(safe-area-inset-bottom, 0px)); margin-top: 8px;
}
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
.chip {
  min-height: 42px; padding: 4px 12px; background: var(--surface); color: var(--ink); border: 1.5px solid var(--line);
  border-radius: 8px; font-family: var(--serif); font-size: 1.05rem; cursor: pointer;
}
.chip.sel { border-color: var(--accent); background: var(--sel); }
.chip.used { opacity: .3; pointer-events: none; }
.total { color: var(--muted); font-size: .9rem; margin: 0 0 8px; }
@media (max-width: 420px) { .opts.two { grid-template-columns: 1fr 1fr; } .idiom { font-size: 1.9rem; } }
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }
</style>
</head>

const SRC = { c: 'Claude 編寫（非辭典例句）', d: '教育部《成語典》', g: '國語辭典' };
D.forEach(x => {
  x.pool = [{ src: 'c', text: x.s }, { src: 'c', text: x.t }];
  (EXTRA[x.w] || []).forEach(e => {
    let t = e[1], hit = false;
    for (const v of [x.w].concat(ALIAS[x.w] || [])) { if (t.includes(v)) { t = t.replace(v, '{}'); hit = true; break; } }
    x.pool.push({ src: e[0], text: hit ? t : null });
  });
});
let SEEN = {};
try { SEEN = JSON.parse(localStorage.getItem('cy_seen') || '{}'); } catch (e) { SEEN = {}; }
function pick(x) {
  const c = x.pool.map((p, i) => ({ p, i, n: SEEN[x.w + '#' + i] || 0 }));
  const min = Math.min.apply(null, c.map(o => o.n));
  const best = c.filter(o => o.n === min);
  const o = best[Math.floor(Math.random() * best.length)];
  SEEN[x.w + '#' + o.i] = o.n + 1;
  try { localStorage.setItem('cy_seen', JSON.stringify(SEEN)); } catch (e) {}
  return o.p;
}
function other(x, cur) {
  const rest = x.pool.filter(p => p !== cur);
  return rest[Math.floor(Math.random() * rest.length)];
}

const NUM = /[一二三四五六七八九十百千萬兩半]/g;
const fm = w => w.replace(NUM, c => '<b class="n">' + c + '</b>');
const fill = (s, w) => s.replace('{}', '<mark>' + fm(w) + '</mark>');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sample = (a, n) => shuffle(a).slice(0, n);

const stage = document.getElementById('stage');
const barEl = document.getElementById('bar');
const statusEl = document.getElementById('status');
const pyTog = document.getElementById('pytog');
let mode = 'meaning', showPy = true, S = null, P = null;
const N = 10;

pyTog.addEventListener('change', () => { showPy = pyTog.checked; if (S && S.kind === 'meaning' && !S.done) renderQuestion(S.answered); });
document.querySelectorAll('.tab').forEach(t => t.addEventListener('click', () => setMode(t.dataset.mode)));

function setMode(m) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.setAttribute('aria-selected', String(t.dataset.mode === m)));
  if (m === 'paste') { P = { total: 0, right: 0 }; newRound(); } else startSession(m);
}

function startSession(m, pool) {
  const items = shuffle(pool && pool.length ? pool : sample(D, N));
  S = { kind: m, items, i: 0, right: 0, miss: [], answered: false, done: false, opts: [] };
  renderQuestion(false);
}

function setProgress(done, total, text) {
  barEl.style.width = (total ? (done / total * 100) : 0) + '%';
  statusEl.textContent = text;
}

function renderQuestion(keepAnswered) {
  const it = S.items[S.i];
  if (!keepAnswered) {
    S.answered = false;
    it.cur = pick(it);
    if (S.kind === 'meaning') S.opts = shuffle([{ t: it.m, c: true, w: it.w }].concat(it.d.map(w => ({ t: BY[w].m, c: false, w: w }))));
    else S.opts = shuffle([it.w].concat(it.d)).map(w => ({ t: w, c: w === it.w, w: w }));
  }
  setProgress(S.i, S.items.length, '第 ' + (S.i + 1) + ' 題 / 共 ' + S.items.length + ' 題');
  let head;
  if (S.kind === 'meaning') {
    head = '<section class="card"><p class="kicker">這個成語的意思是？</p><h2 class="idiom">' + fm(it.w) + '</h2>' +
      (showPy ? '<p class="py">' + it.p + '</p>' : '') + '</section>';
  } else {
    head = '<section class="card"><p class="kicker">選出最適合填入空格的成語</p><p class="sent">' +
      it.cur.text.replace('{}', '<span class="gap"></span>') + '</p></section>';
  }
  const two = S.kind === 'usage' ? ' two' : '';
  const opts = S.opts.map((o, k) =>
    '<button class="opt" data-act="opt" data-v="' + k + '"><span class="k">' + 'ABCD'[k] + '</span><span>' +
    (S.kind === 'usage' ? fm(o.t) : o.t) + '</span></button>').join('');
  stage.innerHTML = head + '<div class="opts' + two + '" id="opts">' + opts + '</div><div id="fb"></div>';
  if (keepAnswered && S.answered) markAnswer(S.pick);
}

function markAnswer(k) {
  const btns = stage.querySelectorAll('.opt');
  btns.forEach((b, j) => {
    b.classList.add('lock');
    if (S.opts[j].c) b.classList.add('ok'); else if (j === k) b.classList.add('bad');
  });
  const it = S.items[S.i], ok = S.opts[k].c;
  let picked = '';
  if (!ok) {
    const o = S.opts[k];
    picked = S.kind === 'meaning'
      ? '<p class="picked">你選的意思屬於：' + fm(o.w) + '（' + BY[o.w].p + '）</p>'
      : '<p class="picked">你選的「' + fm(o.w) + '」是：' + BY[o.w].m + '</p>';
  }
  const last = S.i === S.items.length - 1;
  document.getElementById('fb').innerHTML =
    '<section class="card fb ' + (ok ? 'good' : 'miss') + '"><p class="verdict">' + (ok ? '答對了' : '答錯了') + '</p>' +
    '<p class="big">' + fm(it.w) + ' <span class="py">' + it.p + '</span></p><p>' + it.m + '</p>' + picked +
    '<p class="why">' + it.why + '</p><p class="ex">' + fill(it.cur.text, it.w) + '<br><span class="src">來源：' + SRC[it.cur.src] + '</span></p>' +
    (function () { const o = other(it, it.cur); return '<p class="ex2">另一個例句：' + fill(o.text, it.w) + '<br><span class="src">來源：' + SRC[o.src] + '</span></p>'; })() + '</section>' +
    '<button class="primary" data-act="next">' + (last ? '看結果' : '下一題') + '</button>';
  document.getElementById('fb').scrollIntoView({ block: 'nearest', behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}

function answerOpt(k) {
  if (S.answered) return;
  S.answered = true; S.pick = k;
  const it = S.items[S.i];
  if (S.opts[k].c) S.right++; else S.miss.push(it);
  markAnswer(k);
}

function nextQ() {
  if (S.i < S.items.length - 1) { S.i++; renderQuestion(false); window.scrollTo(0, 0); }
  else showResult();
}

function showResult() {
  S.done = true;
  const n = S.items.length;
  setProgress(n, n, '完成');
  const miss = S.miss.map(it =>
    '<li><strong>' + fm(it.w) + '</strong> <span class="py">' + it.p + '</span><br>' + it.m + '<br><span class="why">' + it.why + '</span></li>').join('');
  stage.innerHTML =
    '<section class="card"><p class="kicker">本回結果</p><p class="score">' + S.right + ' / ' + n + '</p>' +
    (S.miss.length ? '<p>需要再看一次的成語：</p><ul class="misslist">' + miss + '</ul>' : '<p>全部答對。</p>') + '</section>' +
    '<div class="stack"><button class="primary" data-act="again">再練一回（新的 10 題）</button>' +
    (S.miss.length ? '<button class="ghost" data-act="redo">只練答錯的</button>' : '') + '</div>';
  window.scrollTo(0, 0);
}

/* ---- Mode 3: paste words into blanks ---- */
function newRound() {
  const used = new Set(), picks = [];
  for (const it of shuffle(D)) {
    if (!used.has(it.g)) { used.add(it.g); picks.push(it); }
    if (picks.length === 6) break;
  }
  const items = shuffle(picks);
  items.forEach(x => { x.cur = pick(x); });
  P = { total: P.total, right: P.right, items, bank: shuffle(picks.map(x => x.w)), slots: Array(6).fill(null), sel: null, slotSel: null, checked: false };
  renderPaste();
  window.scrollTo(0, 0);
}

function renderPaste() {
  setProgress(P.slots.filter(Boolean).length, 6, '已填 ' + P.slots.filter(Boolean).length + ' / 6');
  const sents = P.items.map((it, i) => {
    const w = P.slots[i];
    const cls = 'slot' + (w ? ' filled' : '') + (P.slotSel === i ? ' active' : '') + (P.checked ? (w === it.w ? ' ok' : ' bad') : '');
    const slot = '<button class="' + cls + '" data-act="slot" data-v="' + i + '">' + (w ? fm(w) : '&emsp;&emsp;&emsp;') + '</button>';
    let fb = '';
    if (P.checked) {
      fb = w === it.w
        ? '<p class="rf ok">答對了　' + it.m + '</p>'
        : '<p class="rf bad">正確答案：' + fm(it.w) + '（' + it.p + '）　' + it.m + '</p>';
      fb += '<p class="why">' + it.why + '</p>';
    }
    if (P.checked) fb += '<p class="src">例句來源：' + SRC[it.cur.src] + '</p>';
    return '<div class="psent"><p class="sent">' + it.cur.text.replace('{}', slot) + '</p>' + fb + '</div>';
  }).join('');
  const placed = new Set(P.slots.filter(Boolean));
  let tray;
  if (!P.checked) {
    const chips = P.bank.map(w => '<button class="chip' + (placed.has(w) ? ' used' : '') + (P.sel === w ? ' sel' : '') + '" data-act="chip" data-v="' + w + '">' + fm(w) + '</button>').join('');
    tray = '<div class="tray"><div class="chips">' + chips + '</div><button class="primary" data-act="check"' + (P.slots.every(Boolean) ? '' : ' disabled') + '>檢查答案</button></div>';
  } else {
    const r = P.slots.filter((w, i) => w === P.items[i].w).length;
    tray = '<div class="tray"><p class="total">本回 ' + r + ' / 6　累計 ' + P.right + ' / ' + P.total + '</p><button class="primary" data-act="newround">下一回合</button></div>';
  }
  stage.innerHTML = '<p class="hint">點下方的成語，再點句子裡的空格。點已填的空格可以取消。</p><section class="card">' + sents + '</section>' + tray;
}

function place(w, idx) {
  const old = P.slots.indexOf(w);
  if (old >= 0) P.slots[old] = null;
  P.slots[idx] = w; P.sel = null; P.slotSel = null;
  renderPaste();
}
function tapChip(w) {
  if (P.checked) return;
  if (P.slotSel !== null && !P.slots[P.slotSel]) place(w, P.slotSel);
  else { P.sel = P.sel === w ? null : w; renderPaste(); }
}
function tapSlot(i) {
  if (P.checked) return;
  if (P.slots[i]) { P.slots[i] = null; P.slotSel = null; renderPaste(); }
  else if (P.sel) place(P.sel, i);
  else { P.slotSel = P.slotSel === i ? null : i; renderPaste(); }
}
function checkRound() {
  if (!P.slots.every(Boolean)) return;
  P.checked = true;
  P.total += 6;
  P.right += P.slots.filter((w, i) => w === P.items[i].w).length;
  renderPaste();
}

stage.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  const a = b.dataset.act, v = b.dataset.v;
  if (a === 'opt') answerOpt(+v);
  else if (a === 'next') nextQ();
  else if (a === 'again') startSession(mode);
  else if (a === 'redo') startSession(mode, S.miss.slice());
  else if (a === 'chip') tapChip(v);
  else if (a === 'slot') tapSlot(+v);
  else if (a === 'check') checkRound();
  else if (a === 'newround') newRound();
});

setMode('meaning');
</script>
</body>
</html>
